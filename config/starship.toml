# ~/.config/starship.toml

# A minimal left prompt
# format = """$character"""

# OrbStack/LXC dev boxes register as containers, which otherwise shows a
# noisy "⬢ [Systemd]" segment on every prompt.
[container]
disabled = true

[directory]
#style = "fg:#e3e5e5 bg:#769ff0"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
