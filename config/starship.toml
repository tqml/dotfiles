# ~/.config/starship.toml

# A minimal left prompt
# format = """$character"""

# OrbStack/LXC dev boxes register as containers, which otherwise shows a
# noisy "⬢ [Systemd]" segment on every prompt.
[container]
disabled = true

[directory]
#style = "fg:#e3e5e5 bg:#769ff0"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# gitconfig switches user.email per directory (see includeIf in
# ~/dotfiles/gitconfig), so show which identity is actually active here
# rather than assuming.
[custom.git_user]
description = "Shows the git identity (user.email) commits here will use"
command = "git config user.email"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git config user.email >/dev/null"
format = "[as $output]($style) "
style = "dimmed yellow"
